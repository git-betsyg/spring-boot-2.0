# ============================================================
# 公共配置（各环境共享，环境差异见 application-{profile}.yml）
# 激活方式：--spring.profiles.active=dev|test|prod
#           或环境变量 SPRING_PROFILES_ACTIVE
# ============================================================

spring:
  application:
    name: demo
  messages:
    basename: i18n/messages,i18n/ValidationMessages
    encoding: UTF-8
    fallback-to-system-locale: false
  profiles:
    # 默认激活开发环境；部署时通过启动参数或环境变量覆盖
    active: dev
  cache:
    # 显式指定 Redis，避免 classpath 上其它 cache 库干扰自动检测
    type: redis
    redis:
      # 全局默认 TTL（users 区在 RedisConfig 中单独设为 5 分钟）
      time-to-live: 10m
      # 业务前缀，避免多应用共用 Redis 时 key 冲突
      key-prefix: "demo:cache:"
      use-key-prefix: true
      # 不缓存 null，防止穿透后大量空值占内存
      cache-null-values: false
  batch:
    job:
      # Web 应用主流做法：启动时不自动执行 Job，改由 HTTP 接口或命令行触发
      enabled: false
    jdbc:
      # MySQL 等非内嵌库需显式初始化 BATCH_* 元数据表（Spring Boot 2.7 howto 9.4）
      initialize-schema: always
  rabbitmq:
    # 消费者：失败自动重试，重试耗尽后不再 requeue（避免 poison message 死循环）
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
        default-requeue-rejected: false
    # 生产者：开启 confirm + return，便于排查消息是否成功到达 Broker / 队列
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线转驼峰：user_name -> userName（MyBatis-Plus 默认 true，显式声明便于维护）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：auto=数据库自增（默认 assign_id 雪花算法）
      id-type: auto
  # Mapper XML 扫描路径，对应 src/main/resources/mapper/
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 密钥（RSA 公私钥，classpath 下 app.key / app.pub）
jwt:
  private.key: classpath:app.key
  public.key: classpath:app.pub
  # Access Token 有效期（秒），默认 15 分钟
  access-token-expiry: 900
  # Refresh Token 有效期（秒），默认 7 天
  refresh-token-expiry: 604800
  refresh-token-cookie-name: refresh_token
  # 生产环境请在 application-prod.yml 中设为 true（HTTPS）
  cookie-secure: false

# SpringDoc OpenAPI + Swagger UI
springdoc:
  # 在 Swagger UI 中展示 Actuator 端点
  show-actuator: true
  swagger-ui:
    # 刷新页面后保留 Authorization 头，避免重复登录
    persist-authorization: true
