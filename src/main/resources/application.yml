# ============================================================
# 公共配置（各环境共享，环境差异见 application-{profile}.yml）
# 激活方式：--spring.profiles.active=dev|test|prod
#           或环境变量 SPRING_PROFILES_ACTIVE
# ============================================================

spring:
  application:
    name: demo
  profiles:
    # 默认激活开发环境；部署时通过启动参数或环境变量覆盖
    active: dev

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线转驼峰：user_name -> userName（MyBatis-Plus 默认 true，显式声明便于维护）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：auto=数据库自增（默认 assign_id 雪花算法）
      id-type: auto
  # Mapper XML 扫描路径，对应 src/main/resources/mapper/
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 密钥（RSA 公私钥，classpath 下 app.key / app.pub）
jwt:
  private.key: classpath:app.key
  public.key: classpath:app.pub

# SpringDoc OpenAPI + Swagger UI
springdoc:
  # 在 Swagger UI 中展示 Actuator 端点
  show-actuator: true
  swagger-ui:
    # 刷新页面后保留 Authorization 头，避免重复登录
    persist-authorization: true
