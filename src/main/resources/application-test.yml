# ============================================================
# 测试环境（profile: test）
# 适用场景：CI/CD、集成测试、联调环境
# 启动：--spring.profiles.active=test
# 数据库连接可通过环境变量覆盖（括号内为默认值）
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ${变量名:默认值}：未设置环境变量时使用默认值
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:demo_test}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  flyway:
    # 测试环境开启自动迁移，保证库结构与脚本一致
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

logging:
  level:
    root: INFO
    com.example.demo: INFO
  file:
    name: logs/demo-test.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14           # 测试环境保留 14 天即可
      total-size-cap: 500MB

# Actuator：测试环境仅暴露常用监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
