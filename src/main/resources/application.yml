# ============================================================
# 公共配置（各环境共享，环境差异见 application-{profile}.yml）
# 激活方式：--spring.profiles.active=dev|test|prod
#           或环境变量 SPRING_PROFILES_ACTIVE
# ============================================================

spring:
  application:
    name: demo
  profiles:
    # 默认激活开发环境；部署时通过启动参数或环境变量覆盖
    active: dev
  cache:
    # 显式指定 Caffeine，避免 classpath 上其它 cache 库干扰自动检测
    type: caffeine
    # 预创建缓存区（未声明的 cache name 在运行时首次使用时会失败）
    cache-names: demo,users
    caffeine:
      # 全局默认：最多 500 条，写入后 10 分钟过期（官方 spec 语法）
      spec: maximumSize=500,expireAfterWrite=10m

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线转驼峰：user_name -> userName（MyBatis-Plus 默认 true，显式声明便于维护）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：auto=数据库自增（默认 assign_id 雪花算法）
      id-type: auto
  # Mapper XML 扫描路径，对应 src/main/resources/mapper/
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 密钥（RSA 公私钥，classpath 下 app.key / app.pub）
jwt:
  private.key: classpath:app.key
  public.key: classpath:app.pub
  # Access Token 有效期（秒），默认 15 分钟
  access-token-expiry: 900
  # Refresh Token 有效期（秒），默认 7 天
  refresh-token-expiry: 604800
  refresh-token-cookie-name: refresh_token
  # 生产环境请在 application-prod.yml 中设为 true（HTTPS）
  cookie-secure: false

# SpringDoc OpenAPI + Swagger UI
springdoc:
  # 在 Swagger UI 中展示 Actuator 端点
  show-actuator: true
  swagger-ui:
    # 刷新页面后保留 Authorization 头，避免重复登录
    persist-authorization: true
